pluginManagement {
	repositories {
		maven {
			name = 'Essential'
			url = 'https://repo.essential.gg/repository/maven-public/'
		}
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Ornithe'
			url = 'https://maven.ornithemc.net/releases'
		}
		maven {
			name = 'Ornithe Snapshots'
			url = 'https://maven.ornithemc.net/snapshots'
		}
		gradlePluginPortal()
	}
}
include 'common'

include '1.8.9.fabric'
include '1.8.9.forge'

include '1.12.2.forge'
include '1.16.5.forge'

include '1.20.fabric'
include '1.20.forge'

include '1.21.fabric'
include '1.21.neoforge'

include '26.1.neoforge'
include '26.2.neoforge'
include '26.3.neoforge'


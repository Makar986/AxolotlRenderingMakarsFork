pluginManagement {
	repositories {
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Ornithe'
			url = 'https://maven.ornithemc.net/releases'
		}
		maven {
			name = 'Ornithe Snapshots'
			url = 'https://maven.ornithemc.net/snapshots'
		}
		gradlePluginPortal()
	}
}
include 'common'

include '1.8.9'

include '1.20.fabric'
include '1.20.forge'

include '1.21.fabric'
include '1.21.neoforge'

// Aliases for compatibility
include '1.20'
project(':1.20').projectDir = file('1.20.fabric')
include '1.21'
project(':1.21').projectDir = file('1.21.neoforge')

